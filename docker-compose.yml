services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: netscope
      POSTGRES_PASSWORD: netscope
      POSTGRES_DB: netscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://netscope:netscope@db:5432/netscope
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: